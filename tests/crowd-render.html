<!doctype html><html lang="ru"><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QA · плотная волна</title><style>body{background:#21170e;color:#fff2d4;font:16px sans-serif}button{padding:15px}canvas{width:800px;max-width:100%;height:auto;background:#587447}pre{white-space:pre-wrap}</style><h1>QA: 600 врагов, 500 снарядов, 10 000 семечек</h1><p>Общий движок и renderer. Не полный профиль game.js. Радио и интерфейс в этот замер не входят.</p><button id="run">Измерить 300 кадров</button><pre id="result">Готово</pre><canvas width="1200" height="800"></canvas><script type="module">
import {createGame,step,spawnEnemy} from '../engine.js';import {art,walkArt,birdArt,creature} from '../render.js';import {combatArt} from '../combat-art.js';import {seed,visibleSeed,telegraphs,groundEffects} from '../render-next.js';import {projectile} from '../projectile.js';import {visibleBody} from '../render-budget.js';
const ctx=document.querySelector('canvas').getContext('2d'),result=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;result.textContent='Загружаем спрайты…';await Promise.all([...Object.values(art),...Object.values(walkArt).flat(),...Object.values(birdArt).flatMap(Object.values).flat(),...Object.values(combatArt)].map(im=>im.decode().catch(()=>{})));let rng=42;const random=()=>((rng=Math.imul(rng,1664525)+1013904223>>>0)/4294967296);const s=createGame('ryaba',random);s.spawnTimer=s.ambientTimer=1e9;s.need=1e12;s.player.inv=1e6;s.weapons={};for(let i=0;i<600;i++){const e=spawnEnemy(s,['rat','fox','duck','wolf','goose','bear'][i%6]);e.x=s.player.x-1100+random()*2200;e.y=s.player.y-800+random()*1600;e.hp=e.maxHp=1e12;}s.gems=Array.from({length:10000},(_,i)=>({x:random()*7200,y:random()*4800,value:1,tier:[1,3,8][i%3]}));for(let i=0;i<500;i++)s.bullets.push({id:i,type:'egg',weapon:'egg',x:s.player.x-1000+random()*2000,y:s.player.y-700+random()*1400,vx:0,vy:0,r:6,size:1,damage:1,pierce:Infinity,bounces:0,hits:new Set(),life:1000});const view={x:s.player.x-600,y:s.player.y-400,w:1200,h:800},times=[],intervals=[],visible=[];let n=0,last=0;result.textContent='Измеряем…';function frame(now){const start=performance.now();step(s,1/60);s.events.length=0;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#587447';ctx.fillRect(0,0,1200,800);ctx.translate(-view.x,-view.y);groundEffects(ctx,s);for(const g of s.gems)if(visibleSeed(g,view))seed(ctx,g,s.time);visible.length=0;for(const e of s.enemies)if(visibleBody(e,view))visible.push(e);visible.sort((a,b)=>a.y-b.y);for(const e of visible)creature(ctx,e.type,e.x,e.y,e.r,e.facing,s.time+e.id*.173,true,0,e.flash,e.attack);creature(ctx,'ryaba',s.player.x,s.player.y,s.player.r,1,s.time,true);for(const b of s.bullets)projectile(ctx,b);telegraphs(ctx,s);if(n>60){times.push(performance.now()-start);intervals.push(now-last);}last=now;if(++n<300){if(n%30===0)result.textContent='Кадр '+n+' / 300';requestAnimationFrame(frame);}else{times.sort((a,b)=>a-b);intervals.sort((a,b)=>a-b);const stats=a=>({p50:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],max:a.at(-1)});result.textContent=JSON.stringify({frames:times.length,workMs:stats(times),rafIntervalMs:stats(intervals),longFrames:intervals.filter(t=>t>50).length,drawnEnemies:visible.length,totalEnemies:s.enemies.length,seeds:s.gems.length,note:'Cloud Chrome; not a mobile device certification.'},null,2);document.querySelector('#run').disabled=false;}}requestAnimationFrame(frame);};</script></html>
