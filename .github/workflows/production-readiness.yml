name: Production candidate checks
on:
  pull_request:
  push:
    branches: [main, 'production/**']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node build-runtime.mjs
      - run: node scripts/verify-release.mjs build
      - run: node build-runtime.mjs --production
      - run: node scripts/verify-release.mjs build-production
