name: Verify production candidate
on:
  push:
    paths: ['releases/2026-11-12/**', '.github/workflows/production-candidate.yml']
  pull_request:
    paths: ['releases/2026-11-12/**', '.github/workflows/production-candidate.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node releases/2026-11-12/verify.mjs
