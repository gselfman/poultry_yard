<!doctype html><meta charset="utf-8"><title>Проверка отрисовки XP</title><style>body{background:#201a12;color:#fff2d4;font:16px sans-serif}button{padding:16px}pre{white-space:pre-wrap}canvas{width:600px;height:400px}</style><h1>Сравнение отрисовки опыта</h1><button id="run">Измерить 1 000 и 10 000 семечек</button><pre id="result">Готово к измерению</pre><canvas width="1200" height="800"></canvas><script type="module">
import {seed as oldSeed} from './perf-seed-before.js';import {seed,visibleSeed} from './render-next.js';import {art} from './render.js';const ctx=document.querySelector('canvas').getContext('2d'),out=document.querySelector('pre');const view={x:0,y:0,w:1200,h:800};document.querySelector('button').onclick=async()=>{await Promise.all(Object.values(art).map(im=>im.decode().catch(()=>{})));const rows=[];for(const n of [1000,10000]){const gems=Array.from({length:n},(_,i)=>({x:(i*71)%7200,y:(i*37)%4800,tier:[1,3,8][i%3]}));for(const [name,draw,cull]of [['before',oldSeed,false],['cached-all',seed,false],['cached-visible',seed,true]]){const times=[];let visible=0;for(let j=0;j<4;j++){ctx.clearRect(0,0,1200,800);let drawn=0;const start=performance.now();for(const g of gems)if(!cull||visibleSeed(g,view)){draw(ctx,g,j);drawn++;}ctx.getImageData(0,0,1,1);times.push(performance.now()-start);visible=drawn;}rows.push({seeds:n,mode:name,drawn:visible,ms:times.slice(1).reduce((a,b)=>a+b)/3,maxMs:Math.max(...times)});}}out.textContent=JSON.stringify(rows,null,2);};</script>
